  <g id="deer" fill="none" stroke="#a56e2a" stroke-linecap="round" stroke-linejoin="round"><path d="M-25 5H4l13-9 9 2-7 6 9 4-12 4-9 10M-19 5l-5 19M-4 5l-2 19M7 6l9 18"/><path d="M16-3l2-11m2 11 6-9m-8 9-6-9"/></g>
