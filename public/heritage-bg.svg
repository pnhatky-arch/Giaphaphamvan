    <stop offset=".88" stop-color="#8b5b2d" stop-opacity="0"/>
    <stop offset="1" stop-color="#8b5b2d" stop-opacity=".065"/>
  </linearGradient>
  <pattern id="grain" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="5" cy="8" r=".7" fill="#7b522b" opacity=".045"/>
    <circle cx="21" cy="20" r=".6" fill="#9a7041" opacity=".04"/>
    <path d="M2 25l8-1M16 4l6-1M10 15l4-.7" stroke="#7b522b" stroke-width=".42" opacity=".04"/>
  </pattern>
</defs>

