      <stop stop-color="#5d0710"/>
      <stop offset=".46" stop-color="#8f101c"/>
      <stop offset="1" stop-color="#b6202d"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#fff2bb"/>
      <stop offset=".45" stop-color="#e3bd63"/>
