name: Visual Mobile Check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory public > /tmp/giapha-http.log 2>&1 &
          echo $! > /tmp/giapha-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/giapha-http.log
          exit 1
      - name: Render mobile UI
        run: node tests/visual-smoke.mjs
      - name: Upload mobile render
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-mobile
          path: artifacts/
          if-no-files-found: warn
